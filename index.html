<head>
<meta charset="UTF-8">

<title>Kansas City Area Events Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #e8ff47;
    --accent2: #ff5533;
    --text: #e8e8e8;
    --muted: #666;
    --past: #333;
    --past-text: #444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1.5; }

  /* ── HEADER ── */
  header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 20px 20px 14px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(26px, 6vw, 46px); letter-spacing: 2px; color: var(--accent); line-height: 1; }
  .subtitle { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  input[type="text"] {
    background: #1a1a1a; border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 7px 10px;
    outline: none; flex: 1; min-width: 140px; max-width: 280px;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  select {
    background: #1a1a1a; border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 7px 10px; cursor: pointer; outline: none;
  }
  select:focus { border-color: var(--accent); }

  .toggle-btn {
    background: #1a1a1a; border: 1px solid var(--border); color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .toggle-btn.active { border-color: var(--accent); color: var(--accent); background: #1a1f00; }

  .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── MONTH ── */
  .month-header {
    font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 3px;
    color: var(--accent2); padding: 18px 20px 6px; border-bottom: 1px solid #1e1e1e;
    position: sticky; top: 126px; background: var(--bg); z-index: 50;
  }

  /* ── DATE GROUP ── */
  .date-group { border-bottom: 1px solid #181818; }
  .date-label {
    display: flex; align-items: baseline; gap: 10px; padding: 10px 20px 4px;
    position: sticky; top: 163px; background: var(--bg); z-index: 40;
  }
  .date-day { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--text); line-height: 1; min-width: 24px; }
  .date-dow { background: #1a1f00; color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 6px; }
  .date-dow.weekend { background: #1f0a00; color: var(--accent2); }
  .date-full { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }
  .date-today-badge { background: var(--accent); color: #000; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 6px; letter-spacing: 1px; }

  /* ── EVENTS ── */
  .events-list { padding: 4px 20px 10px; }
  .event {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
    align-items: start; padding: 6px 0; border-bottom: 1px dotted #1a1a1a;
  }
  .event:last-child { border-bottom: none; }
  .event-name { font-weight: 500; color: var(--text); font-size: 13px; }
  .event-note { color: var(--accent2); font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 1px; }
  .event-venue {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent);
    text-align: right; white-space: nowrap; background: #141a00; padding: 2px 7px;
    align-self: start; margin-top: 2px;
  }

  /* ── PAST EVENTS ── */
  .date-group.past .date-day,
  .date-group.past .date-full { color: var(--past-text); }
  .date-group.past .date-dow { background: #1a1a1a; color: #444; }
  .date-group.past .date-dow.weekend { background: #1a1a1a; color: #444; }
  .date-group.past .event-name { color: var(--past-text); }
  .date-group.past .event-note { color: #553322; }
  .date-group.past .event-venue { background: #141414; color: #444; }
  .date-group.past .date-today-badge { display: none; }

  .date-group.hidden-past { display: none; }

  /* ── MISC ── */
  .no-results { text-align: center; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 60px 20px; }
  .upcoming-anchor { display: block; height: 0; }

  @media (max-width: 520px) {
    .month-header { top: 148px; }
    .date-label { top: 185px; }
    .event { grid-template-columns: 1fr; }
    .event-venue { text-align: left; }
    header { padding: 14px 14px 12px; }
    .events-list { padding: 4px 14px 10px; }
    .month-header { padding: 14px 14px 6px; }
    .date-label { padding: 10px 14px 4px; }
  }
</style>
</head>

const MONTHS = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WEEKEND = [0, 6]; // Sun, Sat

// Today's date at midnight local time for comparison
function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// Populate venue dropdown
const venues = [...new Set(RAW.map(e => e.v))].sort();
const sel = document.getElementById('venueFilter');
venues.forEach(v => {
  const o = document.createElement('option');
  o.value = v; o.textContent = v;
  sel.appendChild(o);
});

let hidePast = true;

function togglePast() {
  hidePast = !hidePast;
  const btn = document.getElementById('pastBtn');
  btn.textContent = hidePast ? 'Hide past' : 'Show past';
  btn.classList.toggle('active', hidePast);
  filter();
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const vf = document.getElementById('venueFilter').value;
  const today = todayStr();

  const filtered = RAW.filter(e => {
    const matchQ = !q || e.a.toLowerCase().includes(q) || e.v.toLowerCase().includes(q) || (e.n && e.n.toLowerCase().includes(q));
    const matchV = !vf || e.v === vf;
    return matchQ && matchV;
  });

  render(filtered, today);
}

function render(events, today) {
  const main = document.getElementById('main');

  // Group by month → date
  const months = {};
  events.forEach(e => {
    const mk = e.d.slice(0,7);
    const dk = e.d;
    if (!months[mk]) months[mk] = { name: MONTHS[+e.d.slice(5,7)], dates: {} };
    if (!months[mk].dates[dk]) {
      const dt = new Date(e.d + 'T12:00:00');
      months[mk].dates[dk] = { dow: dt.getDay(), day: dt.getDate(), monthName: MONTHS[dt.getMonth()+1], events: [] };
    }
    months[mk].dates[dk].events.push(e);
  });

  let visibleCount = 0;
  let html = '';
  let firstUpcoming = null;

  Object.keys(months).sort().forEach(mk => {
    const m = months[mk];
    let monthHtml = '';
    let monthHasVisible = false;

    Object.keys(m.dates).sort().forEach(dk => {
      const d = m.dates[dk];
      const isPast = dk < today;
      const isToday = dk === today;
      const isWeekend = WEEKEND.includes(d.dow);
      const hideThisDate = hidePast && isPast;

      if (!isPast) {
        visibleCount += d.events.length;
        if (!firstUpcoming) firstUpcoming = dk;
      } else if (!hidePast) {
        visibleCount += d.events.length;
      }

      if (!hideThisDate) monthHasVisible = true;

      const pastClass = isPast ? ' past' : '';
      const hiddenClass = hideThisDate ? ' hidden-past' : '';
      const todayBadge = isToday ? '<span class="date-today-badge">TODAY</span>' : '';
      const dowClass = isWeekend ? ' weekend' : '';

      monthHtml += `<div class="date-group${pastClass}${hiddenClass}" data-date="${dk}">
        <div class="date-label">
          <span class="date-day">${d.day}</span>
          <span class="date-dow${dowClass}">${DOW_SHORT[d.dow].toUpperCase()}</span>
          <span class="date-full">${d.monthName} ${d.day}, 2026</span>
          ${todayBadge}
        </div>
        <div class="events-list">`;

      d.events.forEach(e => {
        monthHtml += `<div class="event">
          <div>
            <div class="event-name">${e.a}</div>
            ${e.n ? `<div class="event-note">${e.n}</div>` : ''}
          </div>
          <div class="event-venue">${e.v}</div>
        </div>`;
      });

      monthHtml += `</div></div>`;
    });

    if (monthHasVisible) {
      html += `<div class="month-group"><div class="month-header">${m.name}</div>${monthHtml}</div>`;
    }
  });

  if (!html) {
    html = '<div class="no-results">No events match your search.</div>';
    document.getElementById('countLabel').textContent = '0 events';
  } else {
    const label = hidePast ? `${visibleCount} upcoming event${visibleCount !== 1 ? 's' : ''}` : `${visibleCount} event${visibleCount !== 1 ? 's' : ''}`;
    document.getElementById('countLabel').textContent = label;
  }

  main.innerHTML = html;

  // Scroll to first upcoming event on initial load
  if (firstUpcoming && !document.getElementById('search').value) {
    const el = main.querySelector(`[data-date="${firstUpcoming}"]`);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }
}

// Initial render
filter();
